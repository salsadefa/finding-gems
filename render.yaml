# ============================================
# Finding Gems - Render Blueprint
# ============================================
# This file defines the infrastructure for deploying to Render.
# Deploy: Go to https://dashboard.render.com → New → Blueprint → Connect this repo
# ============================================

services:
  # Backend API Service
  - type: web
    name: finding-gems-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore  # Closest to Indonesia
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Server Config
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      
      # Supabase (from Render Dashboard or sync)
      - key: SUPABASE_URL
        sync: false  # Set manually in Render Dashboard
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      
      # JWT Secrets (generate these)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      
      # Xendit Payment (set manually)
      - key: XENDIT_API_KEY
        sync: false
      - key: XENDIT_WEBHOOK_TOKEN
        sync: false
      
      # Email (optional)
      # Recommended on Render: Resend HTTP API (set manually)
      - key: EMAIL_PROVIDER
        value: smtp
      - key: RESEND_API_KEY
        sync: false

      # Resend SMTP (STARTTLS - set manually if needed)
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: SMTP_TLS_REJECT_UNAUTHORIZED
        value: true
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: SMTP_GREETING_TIMEOUT_MS
        value: 10000
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: 20000
      - key: EMAIL_FROM
        value: contact@dualangka.com
      - key: EMAIL_FROM_NAME
        value: Dualangka

      # OTP
      - key: OTP_SECRET
        sync: false
      
      # Frontend URL
      - key: FRONTEND_URL
        value: https://finding-gems.vercel.app
      - key: FRONTEND_URL_SECONDARY
        value: https://finding-gems-frontend.onrender.com
      - key: APP_BASE_URL
        value: https://finding-gems.vercel.app

  # Frontend (Next.js) Service
  - type: web
    name: finding-gems-frontend
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://finding-gems-backend.onrender.com/api/v1
